name: Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: O que você fez, o que esperava e o que viu.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. solarhub add https://github.com/...
        2. ...
  - type: input
    id: version
    attributes:
      label: Versão
      description: Saída de `solarhub --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema
      options: [Linux, Windows, outro]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Saída do `solarhub doctor`
      render: text
