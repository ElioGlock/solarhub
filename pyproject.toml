[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "solarhub"
version = "0.4.0"
description = "Hub local de conhecimento para desenvolvimento com IA: ADRs, guardrails, guidelines, skills e mais, sincronizados de repositórios Git e entregues a Copilot, Claude Code, Cursor e Gemini via MCP, skills e CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elio Junior" }]
keywords = ["mcp", "ai-agents", "adr", "architecture", "knowledge-base", "copilot", "claude-code", "skills",
            "guardrails", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6",
  "tomli>=2; python_version < '3.11'",
  "tomli-w>=1",
  "mcp>=1.2",
  "pypdf>=4",
]

[project.optional-dependencies]
app = ["PySide6-Essentials>=6.6"]          # app de desktop (o `source app` instala)
semantic = ["fastembed>=0.4"]              # busca por significado (opcional, ~250 MB com o modelo)
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/ElioGlock/solarhub"
Repository = "https://github.com/ElioGlock/solarhub"
Issues = "https://github.com/ElioGlock/solarhub/issues"
Changelog = "https://github.com/ElioGlock/solarhub/blob/main/CHANGELOG.md"

[project.scripts]
solarhub = "solarhub.cli:main"

[project.gui-scripts]
solarhub-app = "solarhub.desktop.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/solarhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
